<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vigor & Estilo</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <div class="app">


        <!-- ========================= -->
        <!-- MENU LATERAL -->
        <!-- ========================= -->

        <aside class="sidebar">


            <!-- LOGO -->

            <div class="logo">

                <h1>
                    Vigor & Estilo
                </h1>

                <span>
                    Sistema de Gestão
                </span>

            </div>


            <!-- MENU -->

            <nav class="menu">


                <!-- INÍCIO -->

                <button class="menu-item active" data-page="inicio">

                    Início

                </button>


                <!-- PRODUTOS -->

                <button class="menu-item" data-page="produtos">

                    Produtos

                </button>


                <!-- CLIENTES -->

                <button class="menu-item" data-page="clientes">

                    Clientes

                </button>


                <!-- REGISTRAR VENDA -->

                <button class="menu-item" data-page="venda">

                    Registrar Venda

                </button>


                <!-- VENDAS -->

                <button class="menu-item" data-page="vendasPeriodo">

                    Vendas

                </button>


                <!-- TROCA DE PRODUTO -->

                <button class="menu-item" data-page="troca">

                    Troca de Produto

                </button>


                <!-- ENTRADA DE MERCADORIAS -->

                <button class="menu-item" data-page="entradaMercadoria">

                    Entrada de Mercadorias

                </button>


                <!-- ESTOQUE -->

                <button class="menu-item" data-page="estoque">

                    Estoque

                </button>

            </nav>


            <!-- USUÁRIO -->

            <div class="usuario">

                <div class="avatar">
                    R
                </div>


                <div class="usuario-info">

                    <strong>
                        Roberto
                    </strong>

                    <span>
                        Administrador
                    </span>

                </div>

            </div>

        </aside>


        <!-- ========================= -->
        <!-- ÁREA PRINCIPAL -->
        <!-- ========================= -->

        <main class="main">


            <!-- CABEÇALHO -->

            <header class="topbar">


                <div class="topbar-title">

                    <h2 id="tituloPagina">
                        Página Inicial
                    </h2>

                    <p>
                        Sistema Vigor & Estilo
                    </p>

                </div>


                <div class="topbar-right">

                    <div class="status">
                        Sistema Online
                    </div>

                    <div class="topbar-user">
                        Roberto
                    </div>

                </div>

            </header>


            <!-- ========================= -->
            <!-- CONTEÚDO DAS PÁGINAS -->
            <!-- ========================= -->

            <section id="conteudo" class="conteudo">

                <div class="loading">
                    Carregando...
                </div>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script src="js/script.js"></script>

</body>

</html>
